<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="uno-api" content="" />
    <meta name="goatcounter-code" content="ataraxos-uno" />
    <title>Ataraxos-UNO — Imperfect-Information 1v1 UNO AI</title>
    <meta
      name="description"
      content="Play against Ataraxos-UNO — an imperfect-information RL agent and risk-averse search engine for 1v1 UNO running 100% client-side via WebGPU."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tanishkbansode.github.io/uno-ataraxos/" />
    <meta property="og:title" content="Ataraxos-UNO — Imperfect-Information 1v1 UNO AI" />
    <meta
      property="og:description"
      content="Play against Ataraxos-UNO — an imperfect-information RL agent and risk-averse search engine for 1v1 UNO running 100% client-side via WebGPU."
    />
    <meta property="og:image" content="https://tanishkbansode.github.io/uno-ataraxos/og-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tanishkbansode.github.io/uno-ataraxos/" />
    <meta name="twitter:title" content="Ataraxos-UNO — Imperfect-Information 1v1 UNO AI" />
    <meta
      name="twitter:description"
      content="Play against Ataraxos-UNO — an imperfect-information RL agent and risk-averse search engine for 1v1 UNO running 100% client-side via WebGPU."
    />
    <meta name="twitter:image" content="https://tanishkbansode.github.io/uno-ataraxos/og-preview.png" />
    <link href="favicon.ico" rel="shortcut icon" type="image/x-icon" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/utils.css" rel="stylesheet" />
    <link href="css/connect.css" rel="stylesheet" />
    <link href="css/game.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js" crossorigin="anonymous"></script>
    <script
      data-goatcounter="https://ataraxos-uno.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <main id="body">
      <div id="login-container">
        <form id="login-form" novalidate>
          <div class="login-brand">
            <h1 class="login-title">Ataraxos-UNO</h1>
            <p class="login-subtitle">1v1 UNO AI</p>
          </div>

          <label class="visually-hidden" for="username">Player Name</label>
          <input
            class="input form-control"
            id="username"
            name="Username"
            placeholder="Your name"
            type="text"
            value="Player"
            maxlength="24"
            autocomplete="nickname"
            autofocus
          />
          <button type="submit" id="connect">Play</button>

          <div id="ai-loading-status" aria-live="polite">
            <div class="ai-status-row">
              <span id="ai-status-dot" class="status-dot"></span>
              <span id="ai-status-text">Loading AI...</span>
            </div>
            <div id="ai-progress-bar-container">
              <div id="ai-progress-bar"></div>
            </div>
            <button type="button" id="ai-retry-btn" class="hidden">
              Retry
            </button>
          </div>

          <div class="login-footer">
            <a
              id="login-github-link"
              class="login-link-pill"
              href="https://github.com/TanishkBansode/uno-ataraxos"
              target="_blank"
              rel="noopener noreferrer"
              data-track-event="github-click"
            >
              <svg class="ui-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
              </svg>
              <span>GitHub</span>
            </a>
            <button type="button" id="login-stats-btn" class="login-link-pill">
              <svg class="ui-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 13V8M8 13V3M13 13V6"/>
              </svg>
              <span>Stats</span>
            </button>
          </div>
        </form>
      </div>

      <div id="game-container" class="hidden">
        <img draggable="false" src="resources/gameBackground.jpg" id="bgimg" alt="" />
        <img draggable="false" src="resources/table.png" id="table" alt="" />

        <!-- Top HUD: Win Chance, Belief X-Ray, Stats & GitHub -->
        <nav id="ataraxos-hud" aria-label="Game controls">
          <div class="hud-pill" id="win-prob-pill">
            <span class="hud-label">AI Win</span>
            <span id="win-prob-val">50.0%</span>
            <div id="win-prob-bar-bg"><div id="win-prob-bar-fill"></div></div>
          </div>
          <button
            type="button"
            id="xray-toggle-btn"
            class="hud-pill hud-btn"
            title="Show AI hand predictions"
            aria-expanded="false"
            aria-controls="belief-xray-panel"
          >
            <svg class="ui-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8Z"/>
              <circle cx="8" cy="8" r="2"/>
            </svg>
            <span>X-Ray</span>
          </button>
          <button
            type="button"
            id="hud-stats-btn"
            class="hud-pill hud-btn"
            title="Match & AI stats"
          >
            <svg class="ui-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 13V8M8 13V3M13 13V6"/>
            </svg>
            <span>Stats</span>
          </button>
          <a
            id="hud-github-link"
            class="hud-pill hud-btn hud-link"
            href="https://github.com/TanishkBansode/uno-ataraxos"
            target="_blank"
            rel="noopener noreferrer"
            title="GitHub Repository"
            aria-label="GitHub Repository"
            data-track-event="github-click"
          >
            <svg class="ui-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
            </svg>
            <span class="hud-github-text">GitHub</span>
          </a>
        </nav>

        <!-- Belief X-Ray Panel -->
        <aside id="belief-xray-panel" class="hidden" aria-label="AI Hand Predictions">
          <div class="xray-header">
            <span>AI Hand Predictions</span>
            <button type="button" id="xray-close-btn" aria-label="Close AI Hand Predictions">&times;</button>
          </div>
          <div class="xray-body">
            <div class="xray-grid">
              <div class="xray-item"><span class="badge-tag red-tag">Red</span> <span class="xray-pct" id="xray-red">--%</span></div>
              <div class="xray-item"><span class="badge-tag green-tag">Green</span> <span class="xray-pct" id="xray-green">--%</span></div>
              <div class="xray-item"><span class="badge-tag blue-tag">Blue</span> <span class="xray-pct" id="xray-blue">--%</span></div>
              <div class="xray-item"><span class="badge-tag yellow-tag">Yellow</span> <span class="xray-pct" id="xray-yellow">--%</span></div>
              <div class="xray-item"><span class="badge-tag p2-tag">+2 Draw</span> <span class="xray-pct" id="xray-p2">--%</span></div>
              <div class="xray-item"><span class="badge-tag p4-tag">+4 Wild</span> <span class="xray-pct" id="xray-p4">--%</span></div>
            </div>
            <div class="xray-footer-note hidden" id="xray-footer-note"></div>
          </div>
        </aside>

        <!-- Opponent (Bot) Cards at top -->
        <div id="bot-cards"></div>

        <div id="cards-desk">
          <img
            draggable="false"
            src="resources/cards/UNO_CARD.png"
            class="card-desk"
            id="START_CARD"
            alt="Start game deck"
          />
          <button type="button" id="start-game-btn" class="start-deal-btn">
            Deal Cards
          </button>
        </div>

        <div id="stacking-container">
          <img id="stacking-image" src="resources/stacking.png" alt="" />
          <span id="stacking-count"></span>
        </div>

        <div id="players"></div>
        <img
          id="arrow"
          class="arrow directionRight"
          src="resources/direction.png"
          alt=""
          style="visibility: hidden"
        />
        <button
          type="button"
          id="carddeck"
          class="disabled"
          title="Draw card"
          aria-label="Draw card"
        >
          <img src="resources/desk.png" alt="" draggable="false" />
        </button>
        <div id="cards"></div>

        <div id="color-select" role="group" aria-label="Choose wild color">
          <button type="button" class="color" id="YELLOW" aria-label="Choose Yellow"></button>
          <button type="button" class="color" id="GREEN" aria-label="Choose Green"></button>
          <button type="button" class="color" id="BLUE" aria-label="Choose Blue"></button>
          <button type="button" class="color" id="RED" aria-label="Choose Red"></button>
        </div>

        <div id="winner-container" class="hidden">
          <div id="winner-wrapper">
            <div class="winner-badge">
              <img id="winner-crown" src="resources/crown.png" alt="" draggable="false" />
              <img id="winner-avatar" src="resources/defaultAvatar.png" alt="Winner avatar" draggable="false" />
            </div>
            <h2 class="winner-title" id="winner-username"></h2>
            <p class="winner-summary" id="winner-summary"></p>
            <div class="winner-actions">
              <button type="button" id="winner-return">Play Again</button>
              <button type="button" id="winner-stats-btn" class="winner-secondary-btn">
                Stats
              </button>
            </div>
            <p class="winner-timeout" id="winner-timeout"></p>
          </div>
        </div>
      </div>
    </main>

    <!-- In-Game Match & AI Stats Modal -->
    <dialog id="stats-dialog" closedby="any" aria-labelledby="stats-dialog-title">
      <div class="stats-dialog-header">
        <h2 id="stats-dialog-title">Stats</h2>
        <button type="button" id="stats-close-btn" class="stats-close-btn" aria-label="Close stats">
          &times;
        </button>
      </div>

      <div class="stats-dialog-body">
        <section class="stats-section" aria-label="Match record">
          <h3 class="stats-section-title">Record</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">Games</span>
              <strong class="stat-value" id="stat-games">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Wins</span>
              <strong class="stat-value win" id="stat-wins">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Losses</span>
              <strong class="stat-value loss" id="stat-losses">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Win Rate</span>
              <strong class="stat-value" id="stat-winrate">0.0%</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Streak</span>
              <strong class="stat-value" id="stat-streak">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Fastest Win</span>
              <strong class="stat-value" id="stat-fastest-win">—</strong>
            </div>
          </div>
        </section>

        <section class="stats-section" aria-label="AI engine telemetry">
          <h3 class="stats-section-title">AI Engine</h3>
          <div class="stats-engine-strip">
            <div class="stat-inline">
              <span class="stat-label">Backend</span>
              <strong class="stat-value stat-small" id="stat-backend">—</strong>
            </div>
            <div class="stat-inline">
              <span class="stat-label">Moves</span>
              <strong class="stat-value stat-small" id="stat-ai-moves">0</strong>
            </div>
            <div class="stat-inline">
              <span class="stat-label">Avg Latency</span>
              <strong class="stat-value stat-small" id="stat-avg-latency">—</strong>
            </div>
          </div>
        </section>

        <section class="stats-section" aria-label="Recent matches">
          <h3 class="stats-section-title">Recent Matches</h3>
          <ul id="stats-recent-list" class="stats-recent-list"></ul>
        </section>
      </div>

      <div class="stats-dialog-footer">
        <a
          class="stats-github-link"
          href="https://github.com/TanishkBansode/uno-ataraxos"
          target="_blank"
          rel="noopener noreferrer"
          data-track-event="github-click"
        >
          GitHub ↗
        </a>
        <button type="button" id="stats-reset-btn" class="stats-reset-btn">
          Reset
        </button>
      </div>
    </dialog>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
