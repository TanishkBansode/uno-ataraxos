<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="uno-api" content="" />
    <title>Ataraxos-UNO — 1v1 UNO AI</title>
    <link href="favicon.ico" rel="shortcut icon" type="image/x-icon" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/utils.css" rel="stylesheet" />
    <link href="css/connect.css" rel="stylesheet" />
    <link href="css/game.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js"></script>
  </head>

  <body>
    <div id="body">
      <div id="login-container">
        <div id="login-form">
          <input
            class="input form-control"
            id="username"
            name="Username"
            placeholder="Username"
            type="text"
            value="Player"
            maxlength="24"
            autocomplete="nickname"
            autofocus
          />
          <input type="submit" id="connect" value="Play!" />
          <div
            id="ai-loading-status"
            style="
              margin-top: 15px;
              font-size: 13px;
              color: #fff;
              text-align: center;
            "
          >
            <div id="ai-status-text">
              Loading AI...
            </div>
            <div
              id="ai-progress-bar-container"
              style="
                width: 100%;
                background: rgba(255, 255, 255, 0.25);
                height: 6px;
                border-radius: 3px;
                margin-top: 6px;
                overflow: hidden;
                display: none;
              "
            >
              <div
                id="ai-progress-bar"
                style="
                  width: 0%;
                  height: 100%;
                  background: #00e676;
                  transition: width 0.2s;
                "
              ></div>
            </div>
          </div>
        </div>
      </div>

      <div id="game-container" class="hidden">
        <img draggable="false" src="resources/gameBackground.jpg" id="bgimg" />
        <img draggable="false" src="resources/table.png" id="table" />

        <!-- Clean Consumer HUD: AI Win Prob, Belief X-Ray Toggle -->
        <div id="ataraxos-hud">
          <div class="hud-pill" id="win-prob-pill">
            <span class="hud-label">AI Win Chance:</span>
            <span id="win-prob-val">50.0%</span>
            <div id="win-prob-bar-bg"><div id="win-prob-bar-fill"></div></div>
          </div>
          <button id="xray-toggle-btn" class="hud-pill hud-btn" title="Show hand predictions">
            👁 X-RAY
          </button>
        </div>

        <!-- Belief X-Ray Panel -->
        <div id="belief-xray-panel" class="hidden">
          <div class="xray-header">
            <span>AI Hand Predictions</span>
            <button id="xray-close-btn">&times;</button>
          </div>
          <div class="xray-body">
            <div class="xray-section">
              <div class="xray-grid">
                <div class="xray-item"><span class="badge-tag red-tag">Red</span> <span id="xray-red">--%</span></div>
                <div class="xray-item"><span class="badge-tag green-tag">Green</span> <span id="xray-green">--%</span></div>
                <div class="xray-item"><span class="badge-tag blue-tag">Blue</span> <span id="xray-blue">--%</span></div>
                <div class="xray-item"><span class="badge-tag yellow-tag">Yellow</span> <span id="xray-yellow">--%</span></div>
                <div class="xray-item"><span class="badge-tag p2-tag">+2 Draw</span> <span id="xray-p2">--%</span></div>
                <div class="xray-item"><span class="badge-tag p4-tag">+4 Wild</span> <span id="xray-p4">--%</span></div>
              </div>
            </div>
            <div class="xray-footer-note">Updates after AI's turn</div>
          </div>
        </div>

        <!-- Opponent (Bot) Cards at top -->
        <div id="bot-cards"></div>

        <div id="cards-desk">
          <img
            draggable="false"
            src="resources/cards/UNO_CARD.png"
            class="card-desk"
            id="START_CARD"
          />
        </div>

        <div id="stacking-container">
          <img id="stacking-image" src="resources/stacking.png" />
          <label id="stacking-count"></label>
        </div>

        <div id="players"></div>
        <img
          id="arrow"
          class="arrow directionRight"
          src="resources/direction.png"
          style="visibility: hidden"
        />
        <img
          id="carddeck"
          class="disabled"
          src="resources/desk.png"
          draggable="false"
          title="Draw card"
        />
        <div id="cards"></div>

        <div id="color-select">
          <canvas class="color" id="YELLOW"></canvas>
          <canvas class="color" id="GREEN"></canvas>
          <canvas class="color" id="BLUE"></canvas>
          <canvas class="color" id="RED"></canvas>
        </div>

        <img id="cover" />

        <div id="winner-container" class="hidden">
          <div id="winner-wrapper">
            <label class="winner-title" id="winner-timeout"></label>
            <label class="winner-title" id="winner-username"></label>
            <img
              id="winner-card"
              src="resources/winner.png"
              draggable="false"
            />
            <img id="winner-avatar" draggable="false" />
            <img
              id="winner-crown"
              src="resources/crown.png"
              draggable="false"
            />
            <span id="winner-return">Play Again</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
